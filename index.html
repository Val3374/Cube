<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation Capteurs</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; }
    canvas { display: block; background: #222; }
  </style>
</head>
<body>

  <canvas id="monCanvas"></canvas>

  <script>
    const canvas = document.getElementById('monCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Objet carré
    const carre = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      taille: 40,
      vx: 0,
      vy: 0,
      ax: 0,
      ay: 0
    };

    const frottement = 1;

    // Écoute directe des mouvements sans permission préalable
    window.addEventListener('devicemotion', (event) => {
      if (event.accelerationIncludingGravity) {
        carre.ax = (event.acceleration.x || 0) / 20;
        carre.ay = -(event.acceleration.y || 0) / 20;
      }
    });

    const dt = 0.02;
    let dernierTemps = performance.now();
    let accumulateur = 0;

    // Physique
    function mettreAJour(dt) {
      carre.vx += carre.ax * dt * frottement;
      carre.vy += carre.ay * dt * frottement;

      carre.x += carre.vx * dt;
      carre.y += carre.vy * dt;

      // Rebond sur les bords
      if (carre.x < 0) { carre.x = 0;}
      if (carre.x + carre.taille > canvas.width) { carre.x = canvas.width - carre.taille;}
      if (carre.y < 0) { carre.y = 0;}
      if (carre.y + carre.taille > canvas.height) { carre.y = canvas.height - carre.taille;}
    }

    // Rendu
    function dessiner() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#c77728';
      ctx.fillRect(carre.x, carre.y, carre.taille, carre.taille);
    }

    // Boucle principale
    function boucle(tempsActuel) {
      let tempsEcoule = (tempsActuel - dernierTemps) / 1000;
      dernierTemps = tempsActuel;
      if (tempsEcoule > 0.25) tempsEcoule = 0.25;
      accumulateur += tempsEcoule;

      while (accumulateur >= dt) {
        mettreAJour(dt);
        accumulateur -= dt;
      }
      
      dessiner();
      requestAnimationFrame(boucle);
    }

    boucle();
  </script>
</body>
</html>
