<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulation Capteurs</title>
  <style>
    body { margin: 0; overflow: hidden; background: #1a1a1a; }
    canvas { display: block; background: #222; }
  </style>
</head>
<body>

  <canvas id="monCanvas"></canvas>

  <script>
    const canvas = document.getElementById('monCanvas');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Objet carré
    const carre = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      taille: 40,
      vx: 0,
      vy: 0,
      ax: 0,
      ay: 0
    };

    const frottement = 0.95;

    // Écoute directe des mouvements sans permission préalable
    window.addEventListener('devicemotion', (event) => {
      if (event.accelerationIncludingGravity) {
        carre.ax = (event.accelerationExcludingGravity.x || 0);
        carre.ay = -(event.accelerationExcludingGravity.y || 0);
      }
    });

    // Physique
    function mettreAJour() {
      carre.vx = (carre.vx + carre.ax) * frottement;
      carre.vy = (carre.vy + carre.ay) * frottement;

      carre.x += carre.vx;
      carre.y += carre.vy;

      // Rebond sur les bords
      if (carre.x < 0) { carre.x = 0; carre.vx = -carre.vx * 0.5; }
      if (carre.x + carre.taille > canvas.width) { carre.x = canvas.width - carre.taille; carre.vx = -carre.vx * 0.5; }
      if (carre.y < 0) { carre.y = 0; carre.vy = -carre.vy * 0.5; }
      if (carre.y + carre.taille > canvas.height) { carre.y = canvas.height - carre.taille; carre.vy = -carre.vy * 0.5; }
    }

    // Rendu
    function dessiner() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(carre.x, carre.y, carre.taille, carre.taille);
    }

    // Boucle principale
    function boucle() {
      mettreAJour();
      dessiner();
      requestAnimationFrame(boucle);
    }

    boucle();
  </script>
</body>
</html>
